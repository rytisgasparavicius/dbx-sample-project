resources:
  jobs:
    ingest_job:
      name: ingest_job_name
      job_clusters: []
      tasks:
        - task_key: ingest          
          spark_python_task:
            python_file: ${workspace.file_path}/src/jobs/ingest_only.py
            parameters:
              - --source_table
              - ${var.source_table}
              - --target_table
              - ${var.target_table}
          environment_key: default
      environments:
        - environment_key: default
          spec: "1"